<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self' capri:">
  <title>Capri — Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="bar">
    <img class="bar__face" src="../../assets/art/happyface.png" alt="">
    <span class="bar__title">Capri · <span data-t="Settings">Settings</span></span>
    <span class="bar__sync" id="sync"></span>
  </header>
  <div class="shell">
    <aside class="side">
      <label class="search" id="searchBox"><input id="search" type="search" autocomplete="off" spellcheck="false"></label>
      <nav class="nav" id="nav" aria-label="Settings sections"></nav>
      <button class="tour-start" id="tourStart" type="button"></button>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="settings.js"></script>
</body>
</html>
