<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self' capri:">
  <title>Capri — Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="bar">
    <img class="bar__face" src="../../assets/art/happyface.png" alt="">
    <span class="bar__title">CAPRI <b>//</b> <span data-t="Settings">Settings</span></span>
    <span class="bar__sync" id="sync"></span>
  </header>
  <div class="tabs">
    <button class="key" id="prevTab" type="button" aria-label="Previous tab" title="Q">Q</button>
    <nav class="nav" id="nav" aria-label="Settings sections"></nav>
    <button class="key" id="nextTab" type="button" aria-label="Next tab" title="E">E</button>
  </div>
  <main class="main" id="main" tabindex="-1"></main>
  <footer class="info" id="info" aria-live="polite">
    <span class="info__mark" aria-hidden="true"></span>
    <span class="info__text"><b class="info__name" id="infoName"></b><span class="info__help" id="infoHelp"></span></span>
  </footer>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="settings.js"></script>
</body>
</html>
